[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tuco-robot-curation"
version = "0.1.0"
description = "Trajectory-level Utility and set-level Coverage Optimization"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
test = ["pytest>=7", "torch>=1.12", "zarr>=2.12,<3", "scipy>=1.9", "tomli>=2; python_version < '3.11'"]
single-sim = ["pyyaml>=6", "scipy>=1.9"]
sim2sim = ["torch>=2.0", "zarr>=2.16,<3", "scipy>=1.9"]
sim2real = [
  "torch>=2.0",
  "hydra-core>=1.2",
  "h5py>=3.8",
  "zarr>=2.16,<3",
  "dill>=0.3.5",
  "threadpoolctl>=3.1",
]

[project.scripts]
tuco-select = "tuco.cli.select:main"
tuco-finalize = "tuco.cli.finalize:main"
tuco-verify-selection = "tuco.cli.verify_selection:main"
tuco-select-dp-baseline = "tuco.cli.select_diffusion_baseline:main"
tuco-verify-curation = "tuco.cli.verify_curated_selection:main"
tuco-protocol = "tuco.cli.protocol:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
