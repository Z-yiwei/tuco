_target_: diffusion_policy.workspace.train_diffusion_unet_image_workspace.TrainDiffusionUnetImageWorkspace
name: train_diffusion_unet_image
task_name: omnireset_peg_image_3cam_jointtarget_teamhome_300x10
exp_name: omnireset_peg_image_3cam_jointtarget_teamhome_300x10
gripper_control: policy_width

horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: 2
past_action_visible: false
keypoint_visible_rate: 1.0
obs_as_global_cond: true

# Deployment contract:
#   observation = 3 RGB cameras + measured [q1..q7, gripper width]
#   action      = absolute [q_target1..q_target7, gripper width target]
shape_meta: &shape_meta
  obs:
    front_rgb:
      shape: [3, 84, 84]
      type: rgb
    side_rgb:
      shape: [3, 84, 84]
      type: rgb
    wrist_rgb:
      shape: [3, 84, 84]
      type: rgb
    proprio:
      shape: [8]
      type: low_dim
  action:
    shape: [8]

policy:
  _target_: diffusion_policy.policy.diffusion_unet_image_policy.DiffusionUnetImagePolicy
  shape_meta: *shape_meta
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    variance_type: fixed_small
    clip_sample: true
    prediction_type: epsilon
  obs_encoder:
    _target_: diffusion_policy.model.vision.multi_image_obs_encoder.MultiImageObsEncoder
    shape_meta: *shape_meta
    rgb_model:
      _target_: diffusion_policy.model.vision.model_getter.get_resnet
      name: resnet18
      weights: null
    resize_shape: [84, 84]
    crop_shape: [76, 76]
    random_crop: true
    use_group_norm: true
    share_rgb_model: false
    imagenet_norm: true
  horizon: 16
  n_action_steps: 8
  n_obs_steps: 2
  num_inference_steps: 100
  obs_as_global_cond: true
  diffusion_step_embed_dim: 128
  down_dims: [256, 512, 1024]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: true
  pin_memory: true
  persistent_workers: false

val_dataloader:
  batch_size: 64
  num_workers: 4
  shuffle: false
  pin_memory: true
  persistent_workers: false

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: cuda:0
  seed: 42
  debug: false
  resume: false
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 600
  gradient_accumulate_every: 1
  use_ema: true
  freeze_encoder: false
  rollout_every: 100000
  checkpoint_every: 25
  val_every: 1
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  project: cupid
  resume: false
  mode: offline
  name: omnireset_peg_image_3cam_jointtarget_teamhome_300x10
  tags: [train_diffusion_unet_image, peg, joint_target, teamhome, 3cam]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: val_loss
    mode: min
    k: 5
    format_str: 'epoch={epoch:04d}-val_loss={val_loss:.5f}.ckpt'
  save_last_ckpt: true
  save_last_snapshot: false

multi_run:
  run_dir: data/outputs/train
  wandb_name_base: omnireset_peg_image_3cam_jointtarget_teamhome_300x10

task:
  name: omnireset_peg_image_3cam_jointtarget_teamhome_300x10
  shape_meta: *shape_meta
  # Keep false: CUPID's abs_action=true is Cartesian pose conversion, not absolute joint control.
  abs_action: false
  dataset:
    _target_: diffusion_policy.dataset.robomimic_replay_image_dataset.RobomimicReplayImageDataset
    shape_meta: *shape_meta
    dataset_path: data/omnireset/datasets/peg_image_3cam_jointtarget_teamhome_300x10/image.hdf5
    horizon: 16
    pad_before: 1
    pad_after: 7
    n_obs_steps: 2
    abs_action: false
    normalize_action: true
    rotation_rep: rotation_6d
    use_legacy_normalizer: false
    use_cache: false
    seed: 42
    val_ratio: 0.04
  env_runner:
    _target_: diffusion_policy.env_runner.dummy_image_runner.DummyImageRunner
